name: Build Kids Video v9 TV APKs

on:
  workflow_dispatch:
  push:
    branches: [ "kids-video-tv-final" ]
    paths:
      - ".github/workflows/build-kids-video-tv.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kids-video-tv-debug-keystore-v2

      - name: Ensure stable TV signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore v9 phone source and apply verified v8.3 TV delta
        run: |
          rm -rf kids-video-tv
          mkdir -p kids-video-tv
          curl --fail --location --retry 3 -o /tmp/final-source-v9.b64 https://raw.githubusercontent.com/davidamerson/davidamerson.github.io/kids-video-final/final-source-v9.b64
          tr -d '\n\r ' < /tmp/final-source-v9.b64 | base64 -d > /tmp/kids-video-v9-source.tar.gz
          echo "963b29f5117bcb0c69fd540e362dc4e5f4ac1f5aa289c833c9eb1c4915d52f37  /tmp/kids-video-v9-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kids-video-v9-source.tar.gz -C kids-video-tv

          cat > /tmp/tv.patch.gz.b64 <<'PATCH64'

PATCH64
          tr -d '\n\r ' < /tmp/tv.patch.gz.b64 | base64 -d | gzip -d > /tmp/tv.patch
          (cd kids-video-tv && patch -p1 < /tmp/tv.patch)

          grep -q "versionName '9.0.0-tv'" kids-video-tv/app/build.gradle
          grep -q "versionCode 90000" kids-video-tv/app/build.gradle
          grep -q "geckoview-beta-armeabi-v7a" kids-video-tv/app/build.gradle
          grep -q "abiFilters 'armeabi-v7a'" kids-video-tv/app/build.gradle
          grep -q "applicationIdSuffix '.daughter.tv'" kids-video-tv/app/build.gradle
          grep -q "applicationIdSuffix '.son.tv'" kids-video-tv/app/build.gradle
          grep -q 'android.software.leanback" android:required="true"' kids-video-tv/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' kids-video-tv/app/src/main/AndroidManifest.xml
          ! grep -q 'android.intent.category.LAUNCHER' kids-video-tv/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' kids-video-tv/app/src/main/AndroidManifest.xml
          grep -q "KEYCODE_DPAD_CENTER" kids-video-tv/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java
          grep -q "tapPlayerCenter" kids-video-tv/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java
          grep -q "ArrowLeft" kids-video-tv/app/src/main/assets/kidslock/content.js
          grep -q "SELECTED" kids-video-tv/app/src/main/java/com/kidsvideo/app/VideoAdapter.java
          grep -q "1.075f" kids-video-tv/app/src/main/java/com/kidsvideo/app/VideoAdapter.java
          grep -q "255, 214, 64" kids-video-tv/app/src/main/java/com/kidsvideo/app/VideoAdapter.java
          grep -q "searchApprovedVideos" kids-video-tv/app/src/main/java/com/kidsvideo/app/YoutubeApi.java
          grep -q "getParentVideosText" kids-video-tv/app/src/main/java/com/kidsvideo/app/Prefs.java
          grep -q "getParentPlaylistsText" kids-video-tv/app/src/main/java/com/kidsvideo/app/Prefs.java
          grep -q "@McCannDogs" kids-video-tv/app/src/main/java/com/kidsvideo/app/AppProfile.java
          grep -q "@StonnieDennis" kids-video-tv/app/src/main/java/com/kidsvideo/app/AppProfile.java
          grep -q "network.http.http3.enable" kids-video-tv/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java
          grep -q "EXTRA_PARENT_SIGN_IN" kids-video-tv/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java

      - name: Build TV Daughter and Son APKs
        working-directory: kids-video-tv
        run: gradle --no-daemon --stacktrace :app:assembleDaughterDebug :app:assembleSonDebug

      - name: Verify ARMv7-only TV APKs
        run: |
          mkdir -p dist
          cp kids-video-tv/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk dist/Daughter-Video-v9-TV.apk
          cp kids-video-tv/app/build/outputs/apk/son/debug/app-son-debug.apk dist/Son-Video-v9-TV.apk
          test -s dist/Daughter-Video-v9-TV.apk
          test -s dist/Son-Video-v9-TV.apk
          unzip -t dist/Daughter-Video-v9-TV.apk >/dev/null
          unzip -t dist/Son-Video-v9-TV.apk >/dev/null
          unzip -l dist/Daughter-Video-v9-TV.apk | grep -q 'lib/armeabi-v7a/libxul.so'
          unzip -l dist/Son-Video-v9-TV.apk | grep -q 'lib/armeabi-v7a/libxul.so'
          if unzip -l dist/Daughter-Video-v9-TV.apk | grep -q 'lib/arm64-v8a/'; then echo 'Unexpected arm64 library in Daughter TV APK'; exit 1; fi
          if unzip -l dist/Son-Video-v9-TV.apk | grep -q 'lib/arm64-v8a/'; then echo 'Unexpected arm64 library in Son TV APK'; exit 1; fi
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          keytool -printcert -jarfile dist/Daughter-Video-v9-TV.apk > dist/SIGNING-CERT-Daughter-TV.txt
          keytool -printcert -jarfile dist/Son-Video-v9-TV.apk > dist/SIGNING-CERT-Son-TV.txt
          tar --exclude='./app/build' --exclude='./.gradle' -czf dist/Kids-Video-v9-TV-Source.tar.gz -C kids-video-tv .

      - uses: actions/upload-artifact@v4
        with:
          name: kids-video-v9-tv
          path: dist/
          if-no-files-found: error
          retention-days: 30
