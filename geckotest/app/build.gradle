plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kidsvideo.geckotest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kidsvideo.geckotest'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview-beta-arm64-v8a:148.0.20260204091025'
}
