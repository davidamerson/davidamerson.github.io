name: Build Kids Video v4 APKs

on:
  workflow_dispatch:
  push:
    branches: [ "kids-video-v4-build" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "kids-video-v4-source.tar.gz.b64"
      - ".github/workflows/build-kids-video-v4.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore source tree
        run: |
          rm -rf kids-video-v4
          mkdir -p kids-video-v4
          base64 -d kids-video-v4-source.tar.gz.b64 > /tmp/kids-video-v4-source.tar.gz
          tar -xzf /tmp/kids-video-v4-source.tar.gz -C kids-video-v4
          test -f kids-video-v4/app/build.gradle

      - name: Build Daughter and Son APKs
        working-directory: kids-video-v4
        run: gradle --no-daemon --stacktrace :app:assembleDaughterDebug :app:assembleSonDebug

      - name: Package outputs
        run: |
          mkdir -p dist
          cp kids-video-v4/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk dist/Daughter-Video-v4.apk
          cp kids-video-v4/app/build/outputs/apk/son/debug/app-son-debug.apk dist/Son-Video-v4.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cp /tmp/kids-video-v4-source.tar.gz dist/Kids-Video-v4-Source.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: kids-video-v4-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30
