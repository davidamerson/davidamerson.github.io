name: Build Kids Video v9 Phone Tablet APKs

on:
  workflow_dispatch:
  push:
    branches: [ "kids-video-final" ]
    paths:
      - "v9-phone-patch-parts/**"
      - ".github/workflows/build-kids-video-v4.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kids-video-v6-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore proven v8 source and apply v9 feature patch
        run: |
          rm -rf kids-video-v9
          mkdir -p kids-video-v9
          cat final-source-parts/*.b64 | tr -d '\n\r ' | base64 -d > /tmp/kids-video-v8-source.tar.gz
          echo "1c8337eca88b20503fa75b26ea211ceea0f5ada2518e15f25b32ccfe4bae4714  /tmp/kids-video-v8-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kids-video-v8-source.tar.gz -C kids-video-v9

          cat v9-phone-patch-parts/*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > /tmp/v9phone.patch
          echo "0b882150b2011293381814a2c7cbb04e0248abefed08fc57d8d82cc7252afc79  /tmp/v9phone.patch" | sha256sum -c -
          (cd kids-video-v9 && patch -p1 < /tmp/v9phone.patch)

          if ! grep -q 'maven.mozilla.org' kids-video-v9/settings.gradle; then
            sed -i "s#mavenCentral()#mavenCentral()\n        maven { url 'https://maven.mozilla.org/maven2/' }#g" kids-video-v9/settings.gradle
          fi

          test -f kids-video-v9/app/build.gradle
          grep -q "versionName '9.0.0'" kids-video-v9/app/build.gradle
          grep -q "versionCode 90000" kids-video-v9/app/build.gradle
          grep -q "geckoview-beta-arm64-v8a" kids-video-v9/app/build.gradle
          grep -q "network.http.http3.enable" kids-video-v9/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java
          grep -q "EXTRA_PARENT_SIGN_IN" kids-video-v9/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java
          grep -q "kidslock" kids-video-v9/app/src/main/assets/kidslock/content.js
          grep -q "searchApprovedVideos" kids-video-v9/app/src/main/java/com/kidsvideo/app/YoutubeApi.java
          grep -q "getParentVideosText" kids-video-v9/app/src/main/java/com/kidsvideo/app/Prefs.java
          grep -q "getParentPlaylistsText" kids-video-v9/app/src/main/java/com/kidsvideo/app/Prefs.java
          grep -q "ensureV9RequestedChannelDefaults" kids-video-v9/app/src/main/java/com/kidsvideo/app/Prefs.java
          grep -q "@McCannDogs" kids-video-v9/app/src/main/java/com/kidsvideo/app/AppProfile.java
          grep -q "@StonnieDennis" kids-video-v9/app/src/main/java/com/kidsvideo/app/AppProfile.java
          grep -q "@WolfooFamilyOffical" kids-video-v9/app/src/main/java/com/kidsvideo/app/AppProfile.java
          grep -q "Bluey - Official Channel" kids-video-v9/app/src/main/java/com/kidsvideo/app/AppProfile.java

      - name: Build Daughter and Son phone tablet APKs
        working-directory: kids-video-v9
        run: gradle --no-daemon --stacktrace :app:assembleDaughterDebug :app:assembleSonDebug

      - name: Package and verify outputs
        run: |
          mkdir -p dist
          cp kids-video-v9/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk dist/Daughter-Video-v9-Phone-Tablet.apk
          cp kids-video-v9/app/build/outputs/apk/son/debug/app-son-debug.apk dist/Son-Video-v9-Phone-Tablet.apk
          test -s dist/Daughter-Video-v9-Phone-Tablet.apk
          test -s dist/Son-Video-v9-Phone-Tablet.apk
          unzip -t dist/Daughter-Video-v9-Phone-Tablet.apk >/dev/null
          unzip -t dist/Son-Video-v9-Phone-Tablet.apk >/dev/null
          unzip -l dist/Daughter-Video-v9-Phone-Tablet.apk | grep -q 'lib/arm64-v8a/libxul.so'
          unzip -l dist/Son-Video-v9-Phone-Tablet.apk | grep -q 'lib/arm64-v8a/libxul.so'
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          keytool -printcert -jarfile dist/Daughter-Video-v9-Phone-Tablet.apk > dist/SIGNING-CERT-Daughter.txt
          keytool -printcert -jarfile dist/Son-Video-v9-Phone-Tablet.apk > dist/SIGNING-CERT-Son.txt
          tar --exclude='./app/build' --exclude='./.gradle' -czf dist/Kids-Video-v9-Phone-Source.tar.gz -C kids-video-v9 .

      - uses: actions/upload-artifact@v4
        with:
          name: kids-video-v9-phone-tablet
          path: dist/
          if-no-files-found: error
          retention-days: 30
