name: Build Kids Video Final APKs

on:
  workflow_dispatch:
  push:
    branches: [ "kids-video-final" ]
    paths:
      - "final-source-parts/**"
      - ".github/workflows/build-kids-video-v4.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kids-video-v6-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore final source tree
        run: |
          rm -rf kids-video-final
          mkdir -p kids-video-final
          cat final-source-parts/*.b64 | tr -d '\n\r ' | base64 -d > /tmp/kids-video-final-source.tar.gz
          echo "1c8337eca88b20503fa75b26ea211ceea0f5ada2518e15f25b32ccfe4bae4714  /tmp/kids-video-final-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kids-video-final-source.tar.gz -C kids-video-final
          test -f kids-video-final/app/build.gradle
          grep -q "versionName '8.0.0'" kids-video-final/app/build.gradle
          grep -q "geckoview-beta-arm64-v8a" kids-video-final/app/build.gradle
          grep -q "network.http.http3.enable" kids-video-final/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java
          grep -q "EXTRA_PARENT_SIGN_IN" kids-video-final/app/src/main/java/com/kidsvideo/app/BrowserPlaybackActivity.java
          grep -q "kidslock" kids-video-final/app/src/main/assets/kidslock/content.js
          grep -q "isYoutubeSignInDone" kids-video-final/app/src/main/java/com/kidsvideo/app/Prefs.java
          ! grep -R -q "TextToSpeech\|startEnglishCoach\|Speak English" kids-video-final/app/src/main/java
          grep -q "Stories & Cartoons" kids-video-final/app/src/main/java/com/kidsvideo/app/MainActivity.java
          grep -q "Mark Rober" kids-video-final/app/src/main/java/com/kidsvideo/app/AppProfile.java
          grep -q "Bluey - Official Channel" kids-video-final/app/src/main/java/com/kidsvideo/app/AppProfile.java

      - name: Build Daughter and Son APKs
        working-directory: kids-video-final
        run: gradle --no-daemon --stacktrace :app:assembleDaughterDebug :app:assembleSonDebug

      - name: Package and verify outputs
        run: |
          mkdir -p dist
          cp kids-video-final/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk dist/Daughter-Video-Final.apk
          cp kids-video-final/app/build/outputs/apk/son/debug/app-son-debug.apk dist/Son-Video-Final.apk
          test -s dist/Daughter-Video-Final.apk
          test -s dist/Son-Video-Final.apk
          unzip -t dist/Daughter-Video-Final.apk >/dev/null
          unzip -t dist/Son-Video-Final.apk >/dev/null
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          keytool -printcert -jarfile dist/Daughter-Video-Final.apk > dist/SIGNING-CERT-Daughter.txt
          keytool -printcert -jarfile dist/Son-Video-Final.apk > dist/SIGNING-CERT-Son.txt
          tar --exclude='./app/build' --exclude='./.gradle' -czf dist/Kids-Video-Final-Source.tar.gz -C kids-video-final .

      - uses: actions/upload-artifact@v4
        with:
          name: kids-video-final-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30
