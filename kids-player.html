<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Kids Video Player</title>
  <style>
    html,body,#stage{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{position:fixed;inset:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    #msg{display:none;position:absolute;inset:0;place-items:center;color:#fff;text-align:center;padding:24px;box-sizing:border-box;background:#000}
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="msg">This video link is not valid.</div>
  <script>
    (() => {
      const id=(new URLSearchParams(location.search).get('v')||'').trim();
      if(!/^[A-Za-z0-9_-]{11}$/.test(id)){
        document.getElementById('msg').style.display='grid';
        return;
      }

      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e) {}

      const params=new URLSearchParams({
        autoplay:'1',
        playsinline:'1',
        rel:'0',
        controls:'1',
        fs:'1',
        enablejsapi:'1',
        origin:location.origin,
        widget_referrer:location.href
      });

      const player=document.createElement('iframe');
      player.title='YouTube video player';
      player.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?'+params.toString();
      player.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
      player.allowFullscreen=true;
      player.referrerPolicy='strict-origin-when-cross-origin';
      document.getElementById('stage').appendChild(player);
    })();
  </script>
</body>
</html>
