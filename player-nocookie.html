<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#000000">
  <title></title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{position:fixed;inset:0}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
  </style>
</head>
<body>
  <iframe id="player" title="YouTube video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const id=(new URLSearchParams(location.search).get('v')||'').trim();
    if(/^[A-Za-z0-9_-]{11}$/.test(id)){
      const p=new URLSearchParams({playsinline:'1',rel:'0',controls:'1',fs:'1',origin:location.origin});
      document.getElementById('player').src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?'+p.toString();
    }
  </script>
</body>
</html>
