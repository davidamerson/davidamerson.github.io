<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <title></title>
  <style>
    html,body,#player{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{position:fixed;inset:0}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (() => {
      const id=(new URLSearchParams(location.search).get('v')||'').trim();
      if(!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
      const f=document.createElement('iframe');
      const params=new URLSearchParams({
        autoplay:'1',
        playsinline:'1',
        rel:'0',
        controls:'1',
        fs:'1',
        origin:location.origin,
        widget_referrer:location.href
      });
      f.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?'+params.toString();
      f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.allowFullscreen=true;
      f.referrerPolicy='strict-origin-when-cross-origin';
      f.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation');
      document.getElementById('player').appendChild(f);
    })();
  </script>
</body>
</html>
